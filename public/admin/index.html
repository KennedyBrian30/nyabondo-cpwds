<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyabondo CMS</title>
</head>
<body>
  <script>
    // Define the config directly in JavaScript
    window.CMS_CONFIG = {
      backend: {
        name: 'github',
        repo: 'KennedyBrian30/nyabondo-cpwds',
        branch: 'main'
      },
      publish_mode: 'simple',
      site_url: 'https://nyabondo-cpwds.org',
      media_folder: 'public/images/uploads',
      public_folder: '/images/uploads',
      collections: [
        {
          name: 'case-studies',
          label: 'Case Studies',
          folder: 'src/content/case-studies',
          create: true,
          slug: '{{slug}}',
          fields: [
            { label: 'Title', name: 'title', widget: 'string' },
            { label: 'Description', name: 'description', widget: 'text' },
            { label: 'Date', name: 'pubDate', widget: 'datetime' },
            { label: 'Featured Image', name: 'image', widget: 'image' },
            { label: 'Body', name: 'body', widget: 'markdown' }
          ]
        }
      ]
    };
  </script>
  <script src="https://unpkg.com/decap-cms-app@3.14.1/dist/decap-cms-app.js"></script>
</body>
</html>
