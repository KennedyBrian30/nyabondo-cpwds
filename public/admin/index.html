<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyabondo CMS</title>
</head>
<body>
  <script>
    // This is the crucial part: define the config with the correct backend
    window.CMS_CONFIG = {
      backend: {
        name: 'github',
        repo: 'KennedyBrian30/nyabondo-cpwds',
        branch: 'main',
        // This tells Decap CMS to use your custom OAuth server endpoint
        auth_endpoint: 'https://www.nyabondo-cpwds.org/api/auth'
      },
      publish_mode: 'simple',
      site_url: 'https://nyabondo-cpwds.org',
      media_folder: 'public/images/uploads',
      public_folder: '/images/uploads',
      collections: [
        {
          name: 'case-studies',
          label: 'Case Studies',
          folder: 'src/content/case-studies',
          create: true,
          slug: '{{slug}}',
          fields: [
            { label: 'Title', name: 'title', widget: 'string' },
            { label: 'Description', name: 'description', widget: 'text' },
            { label: 'Excerpt', name: 'excerpt', widget: 'text', required: false },
            { label: 'Publication Date', name: 'pubDate', widget: 'datetime' },
            { label: 'Author', name: 'author', widget: 'string', required: false },
            { label: 'Category', name: 'category', widget: 'string', required: false },
            { label: 'Featured Image', name: 'image', widget: 'image', required: false },
            { label: 'Featured', name: 'featured', widget: 'boolean', default: false },
            { label: 'Tags', name: 'tags', widget: 'list', required: false },
            { label: 'Body', name: 'body', widget: 'markdown' }
          ]
        }
      ]
    };
  </script>
  <script src="https://unpkg.com/decap-cms-app@3.14.1/dist/decap-cms-app.js"></script>
</body>
</html>
