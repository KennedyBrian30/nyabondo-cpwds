media:
  input: public/images/uploads
  output: /images/uploads

content:
  - name: case-studies
    label: Case Studies
    type: collection
    path: src/content/case-studies
    filename: "{fields.title}.md"

    fields:
      - name: title
        label: Title
        type: string

      - name: description
        label: Description
        type: text

      - name: date
        label: Date
        type: date

      - name: image
        label: Featured Image
        type: image

      - name: body
        label: Story
        type: rich-text